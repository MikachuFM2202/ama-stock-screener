<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMA Stock Screener</title>
<meta name="description" content="Private family Shariah-compliant stock screener, paper trading and market reports">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMA Screener">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=20261021173413">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous" defer></script>
<script type="module" src="app.js?v=20261021173413"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-box" autocomplete="on">
    <div class="brand"><span class="logo">AMA</span> STOCK SCREENER</div>
    <p class="muted">Private family terminal. Enter the family password to unlock the encrypted data.</p>
    <input type="text" name="username" value="family" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Family password" aria-label="Family password" required>
    <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button type="submit" class="btn">UNLOCK</button>
    <p id="loginMsg" class="err" role="alert"></p>
    <p class="note">For education only: not financial or religious advice. Prices are delayed and can be wrong; Shariah statuses are screen results, not fatwas.</p>
  </form>
</div>
<div id="who" class="login" hidden></div>
<div id="app" hidden>
  <header class="top">
    <a class="brand" href="#mkt"><span class="logo">AMA</span><span class="brand-t">STOCK SCREENER</span></a>
    <form id="cmd" class="cmd" autocomplete="off">
      <input id="cmdIn" data-suggest autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Code, short name or company: 5145, SEALINK, Maybank, AAPL, DBS" aria-label="Search stocks" enterkeyhint="go">
      <button type="submit">GO</button>
    </form>
    <button id="stt" class="stt" aria-pressed="false" title="Show what the Shariah letters mean (C = Certified, P = Passes screen, R = Review, F = Non-compliant)">C·P·F</button>
    <button id="refresh" class="icon-btn" title="Refresh data now" aria-label="Refresh data now">⟳</button>
    <div class="clock" id="clock"></div>
    <button id="me" class="avatar" title="Switch profile" aria-label="Switch profile"></button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="ticker" id="ticker" aria-label="Breaking news and market moves"><div class="ticker-track" id="tickerTrack"></div></div>
  <main id="main" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <nav class="bnav" id="bnav" aria-label="Sections"></nav>
</div>
</body>
</html>
